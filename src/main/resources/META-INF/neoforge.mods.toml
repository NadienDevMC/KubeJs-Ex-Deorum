modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "${issue_tracker}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
author = "${mod_authors}"
displayURL = ""
logoFile = "logo.png"
displayName = "Ex Deorum KubeJS Addon"
description = "${mod_description}"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "kubejs"
    type = "required"
    versionRange = "${kubejs_version_range}"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "exdeorum"
    type = "required"
    versionRange = "${exdeorum_version_range}"
    ordering = "AFTER"
    side = "BOTH"
